name: Deploy BetterLoTW to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Set public Worker endpoint
        env:
          LOTW_SYNC_ENDPOINT: ${{ vars.LOTW_SYNC_ENDPOINT }}
        shell: bash
        run: |
          sed -i "s|__LOTW_SYNC_ENDPOINT__|$LOTW_SYNC_ENDPOINT|g" config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
